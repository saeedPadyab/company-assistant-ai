name: ci
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  affected:
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.pick.outputs.web }}
      server: ${{ steps.pick.outputs.server }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - id: pick
        env:
          EVENT: ${{ github.event_name }}
          BASE: origin/${{ github.base_ref }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            echo "push to main: run everything"
            echo "web=true" >> "$GITHUB_OUTPUT"
            echo "server=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # turbo diffs the lockfile per package; any lockfile change runs everything.
          if git diff --name-only "$BASE"...HEAD | grep -qx 'pnpm-lock.yaml'; then
            echo "lockfile changed: run everything"
            echo "web=true" >> "$GITHUB_OUTPUT"
            echo "server=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          affected=$(TURBO_SCM_BASE="$BASE" pnpm exec turbo ls --affected --output=json)
          echo "$affected"
          for pkg in web server; do
            hit=$(echo "$affected" | jq --arg p "$pkg" '[.packages.items[].name] | index($p) != null')
            echo "$pkg=$hit" >> "$GITHUB_OUTPUT"
          done

  web:
    needs: affected
    if: needs.affected.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec turbo run typecheck lint build --filter=web

  server:
    needs: affected
    if: needs.affected.outputs.server == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: assistant
          POSTGRES_PASSWORD: assistant
          POSTGRES_DB: assistant
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U assistant -d assistant"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://assistant:assistant@localhost:5432/assistant
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter server db:migrate
      - run: pnpm --filter server db:seed
      - run: pnpm exec turbo run typecheck lint test --filter=server

  hooks:
    # the team's tooling (guard, pre-push, Stop hook, review-status, review-loop workflow, settings):
    # no turbo package, so always run (seconds, no network or agents)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: scripts/test-tooling.sh

  ci-ok:
    needs: [affected, web, server, hooks]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          for r in $RESULTS; do
            case "$r" in
              failure|cancelled) echo "a required job ended with: $r"; exit 1 ;;
            esac
          done
